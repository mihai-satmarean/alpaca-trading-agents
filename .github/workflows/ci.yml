name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/ scripts/ --select E,F,W --ignore E501

      - name: Run tests
        run: pytest --tb=short -q

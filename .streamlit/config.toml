# Product Advisors design tokens, from CompanyOS
# workspaces/product-advisors/00_brand/design-system/system/tokens.css.
# Streamlit's theme keys are coarse; the fine-grained typography and the
# hero band are applied by dashboard/theme.py on top of these.
[theme]
primaryColor = "#503AA8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

allocation:
  sixfold_pct: 0.1
  options_pct: 0.1
  vampire_pct: 0.1
  pendulum_pct: 0.1
  reserve_pct: 0.1
pendulum:
  symbol: TLT
  entry_z: -2.0
  entry_rsi: 10
  add_z: -2.75
  exit_rsi: 70
  time_stop_days: 10
  atr_mult: 1.5
  hard_stop_pct: 0.05
  regime_lookback: 200
  allow_below_regime: true
  below_regime_size_mult: 0.5
  below_regime_atr_mult: 1.0
  risk_per_trade: 0.01
  first_tranche: 0.6
  run_after: 09:35
vampire:
  paused_until: '2026-09-02'
  regime_advisor:
    enabled: true
    model: dell4-chat
    window_minutes: 15
    bars: 30
    ttl_minutes: 20
    min_confidence: 0.0
    tradeable_regimes:
    - chop
  symbols:
  - QQQ
  - TQQQ
  tick_threshold: 0.02
  position_size: 10
  max_position: 100
  bleed_window_seconds: 5
  reference_type: vwap
  max_daily_loss: 50.0
  max_trades_per_min: 20
options:
  symbols:
  - CLF
  - NIO
  - ABAT
  - F
  - SOFI
  - MARA
  - RIVN
  - T
  csp:
    min_premium_pct: 0.005
    max_days_to_expiry: 45
    min_days_to_expiry: 7
    max_delta: -0.3
    min_open_interest: 100
  covered_call:
    min_premium_pct: 0.003
    max_days_to_expiry: 30
    min_days_to_expiry: 7
    min_delta: 0.2
    max_delta: 0.35
sixfold:
  universe:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - JPM
  - V
  - JNJ
  - UNH
  - PG
  - HD
  - COST
  - ABBV
  - LLY
  - MRK
  - PEP
  - KO
  buy_threshold: 60.0
  hold_threshold: 50.0
  dispose_threshold: 40.0
  max_concurrent: 20
  universe_file: universe_sp400.txt
  scan_interval_seconds: 3600
risk:
  max_daily_loss_pct: 0.02
  max_position_pct: 0.1
  max_single_trade_pct: 0.05
  min_cash_reserve: 5000.0
  circuit_breaker_cooldown_minutes: 30
adapters:
  autobelay:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: competitors/repos/bill-mccormick-dg__alpaca-hackathon
    temperature: 0.6
  killswitch:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: competitors/repos/SamsonDoski__alpaca-trading-assistant
    temperature: 0.5
    max_daily_decay: 0.04
  shouldai:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: competitors/repos/nabielnovelkhubran__Should-AI-Buy
    temperature: 0.5
  neural_trader:
    enabled: false
    capital_pct: 0.0
    dry_run: true
    config_variant: default
    source: neural-trader-ruv MCP (localhost:8100)
    mcp_url: http://localhost:8100/sse
    strategy: momentum_trading
    symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - NVDA
    min_confidence: 0.65
    max_position_pct: 0.02
    scan_interval_seconds: 300
  bull_spread:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: built-in (VetoAlpha reference)
    symbols:
    - QBTS
    - SLV
    - SPY
    - QQQ
    - AAPL
    spread_types:
    - bull_put_credit
    - bull_call_debit
    contracts_per_spread: 1
    max_concurrent_spreads: 5
    wing_width: 5.0
    dte_min: 20
    dte_max: 45
    target_short_delta: 0.2
    min_open_interest: 50
    max_bid_ask_spread_pct: 0.2
    min_net_credit: 0.1
    min_score: 40.0
    scan_interval_seconds: 600

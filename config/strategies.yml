# Agreed 2026-08-31 pre-market: sixfold 50, CSP 20, vampire 20, buffer 10.
#
# The sixfold sleeve is reported but not yet deployable. SixfoldAnalystAgent
# produces buy and disposal candidates and places no orders, so nothing draws
# against this budget until something acts on those recommendations. It is
# named here rather than folded into reserve on purpose: a sleeve showing
# $50,000 allocated and $0 committed makes that gap visible, where a larger
# reserve figure hid it.
# The scalper breached its allocation twice on 2026-08-31 and was disabled at
# 10:50 ET. Root cause was not the cap: it fired IOC market orders, swallowed
# the result, and moved its position counter as though every order filled. IOC
# orders frequently do not. The counter stayed inside +/-8 shares all session
# while the broker reached 96, because the engine believed it had sold what it
# still held and bought again.
#
# Three breaches on 2026-08-31. Root cause found on the third audit and it was
# the second fix: Alpaca returns a market order with filled_qty "0" and status
# "new", and the fill lands 85 to 100ms later. Reading filled_qty off the submit
# response therefore always saw zero, so the counter never moved, the engine
# believed it was flat, and it bought again every tick while every order filled.
# The first two "fixes" were real defects that were not the cause; the second
# one made it worse, taking the worst breach from 96 shares to 271.
#
# _submit now polls to a terminal status, and an UNKNOWN outcome is assumed
# FILLED, because under-counting accumulates without bound while over-counting
# only trades less. max_position is also a ceiling now rather than a trigger.
#
# Running at a QUARTER of the original 20% while it proves out. Raise only after
# a full session where its position tracking matches the broker throughout.
allocation:
  sixfold_pct: 0.50      # Tashi, $50,000
  options_pct: 0.20      # CSP, $20,000
  vampire_pct: 0.05      # scalper, $5,000: quarter size, proving run
  reserve_pct: 0.25      # buffer

vampire:
  # Chosen by measurement on 2026-08-31, not by volatility. What a scalper needs
  # is movement LARGER than the spread it pays to capture it. Sampling 18 liquid
  # names live gave move-per-2.5s divided by spread: PLTR 1.00, SPY 0.84,
  # QQQ 0.81, and under 0.6 for everything else including AAPL at 0.19.
  #
  # Two directions were tested and both make it worse.
  #
  # Volatile names: spreads widen with volatility. TSLA quotes $0.49 and AMD
  # $4.91, giving ratios of 0.09 and 0.00.
  #
  # Cheap names, the BlackBerry thesis: worse still, because the $0.01 minimum
  # tick is a FIXED floor and therefore a larger fraction of a smaller price.
  # Measured as spread in basis points of price: SNDL at $1.35 pays 74bp, PLUG
  # at $2.15 pays 47bp, AMC at $2.62 pays 38bp, BB at $8.07 pays 12bp, against
  # SPY at 1bp. A scalper on a $2 stock pays roughly 40 times the relative
  # spread it pays on SPY. Over 40 seconds of live sampling, most of those names
  # did not move their mid at all: BB scored 0.05, and eleven of them scored
  # 0.00.
  #
  # These three are the least bad measured, and none of them clears 1.5.
  symbols:
    - SPY
    - QQQ
    - PLTR
  tick_threshold: 0.02
  position_size: 10
  max_position: 100
  bleed_window_seconds: 5
  reference_type: vwap
  max_daily_loss: 50.0
  max_trades_per_min: 20

options:
  # Priced for a $20,000 sleeve. The previous list was untradeable here: at
  # today's prices one SPY put ties up $71,500, AAPL $29,700 and NVDA $20,200,
  # so a single contract met or exceeded the entire allocation and the scanner
  # would have found nothing to do all week. These names put collateral between
  # $200 and $2,400 a contract, which is what makes diversifying possible at
  # this size. Thin chains are rejected by min_open_interest rather than by
  # being left off the list.
  symbols:
    - CLF
    - NIO
    - ABAT
    - F
    - SOFI
    - MARA
    - RIVN
    - T
  # BAC (~$5,900 collateral) and INTC (~$8,300) are excluded deliberately: the
  # 5% max_single_trade_pct gate is $5,000 on a $100k account, so neither can
  # ever clear it. Leaving them in only fills the log with skips.
  csp:
    min_premium_pct: 0.005
    max_days_to_expiry: 45
    min_days_to_expiry: 7
    max_delta: -0.30
    min_open_interest: 100
  covered_call:
    min_premium_pct: 0.003
    max_days_to_expiry: 30
    min_days_to_expiry: 7
    min_delta: 0.20
    max_delta: 0.35

sixfold:
  universe:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - META
    - JPM
    - V
    - JNJ
    - UNH
    - PG
    - HD
    - COST
    - ABBV
    - LLY
    - MRK
    - PEP
    - KO
  buy_threshold: 65.0
  dispose_threshold: 40.0
  scan_interval_seconds: 3600

risk:
  max_daily_loss_pct: 0.02
  max_position_pct: 0.10
  max_single_trade_pct: 0.05
  min_cash_reserve: 5000.0
  circuit_breaker_cooldown_minutes: 30

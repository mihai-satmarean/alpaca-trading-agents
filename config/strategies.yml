# Agreed 2026-08-31 pre-market: sixfold 50, CSP 20, vampire 20, buffer 10.
#
# The sixfold sleeve is reported but not yet deployable. SixfoldAnalystAgent
# produces buy and disposal candidates and places no orders, so nothing draws
# against this budget until something acts on those recommendations. It is
# named here rather than folded into reserve on purpose: a sleeve showing
# $50,000 allocated and $0 committed makes that gap visible, where a larger
# reserve figure hid it.
# The scalper breached its allocation twice on 2026-08-31 and was disabled at
# 10:50 ET. Root cause was not the cap: it fired IOC market orders, swallowed
# the result, and moved its position counter as though every order filled. IOC
# orders frequently do not. The counter stayed inside +/-8 shares all session
# while the broker reached 96, because the engine believed it had sold what it
# still held and bought again.
#
# Three breaches on 2026-08-31. Root cause found on the third audit and it was
# the second fix: Alpaca returns a market order with filled_qty "0" and status
# "new", and the fill lands 85 to 100ms later. Reading filled_qty off the submit
# response therefore always saw zero, so the counter never moved, the engine
# believed it was flat, and it bought again every tick while every order filled.
# The first two "fixes" were real defects that were not the cause; the second
# one made it worse, taking the worst breach from 96 shares to 271.
#
# _submit now polls to a terminal status, and an UNKNOWN outcome is assumed
# FILLED, because under-counting accumulates without bound while over-counting
# only trades less. max_position is also a ceiling now rather than a trigger.
#
# Raised to half the original 20% on 2026-08-31 after the position-tracking
# defects were found and fixed and the cap held all afternoon (peak 89% of
# sleeve, never over). The sleeve is split evenly across symbols, so adding
# QQQ and SPY at $5,000 would have left each of the four with $1,250, which
# buys ONE share of a $715 QQQ. Four symbols need the larger sleeve to be
# able to trade at all.
#
# Raised to the full 20% on 2026-09-01, EC2's first live session: the
# opening seven minutes produced a reject cluster (root-caused to a poll
# timeout too tight for opening-bell order flow, fixed in the same commit
# range and not yet deployed at the time of this change) but self-healed
# with zero recurrence for the rest of the morning, no rate limiting, no
# lasting drift. That is the clean session this comment asked for.
# Reallocated 2026-09-01 to fund Pendulum: 5 points each from sixfold,
# options and vampire. Sixfold is the only one that has to sell anything to
# get there; the scalper is halted and the CSP sleeve was already inside its
# new number.
allocation:
  sixfold_pct: 0.45      # Tashi SIXFOLD, was 0.50
  options_pct: 0.15      # CSP, was 0.20
  vampire_pct: 0.15      # scalper, was 0.20
  pendulum_pct: 0.15     # Tashi Pendulum, new
  reserve_pct: 0.10      # buffer

# Pendulum -- mean reversion on long-duration Treasuries, Tashi's spec v1.1.
#
# TLT rather than SPTL. The spec's own v1.1 note settles it: SPTL's option
# chain is too thin to write against, TLT's is among the most liquid in bonds,
# and running one instrument avoids tracking error between the shares and the
# calls. The two backtest within noise of each other at this sample size
# (TLT 11 trades, SPTL 16, over 10.7 years), so liquidity decides rather than
# a return difference that 11 trades cannot support.
#
# BACKTEST, 2016-01-04 to 2026-09-01, adjusted closes, next-open fills,
# 2bp per side (roughly double TLT's typical half-spread):
#
#             trades   return    CAGR    maxDD   win%   expectancy
#   TLT cons.     11   +5.83%   +0.53%  -1.99%  90.9%   +$530/trade
#   TLT aggr.     56  +12.09%   +1.08%  -5.07%  64.3%   +$216/trade
#   buy & hold     -   -9.51%        -       -      -             -
#
# Conservative avoided 2022 entirely (zero trades). Aggressive traded it ten
# times and lost $3,033. That is the whole trade-off in one line.
#
# The 91% win rate is the thing the spec warns to be suspicious of, so it was
# checked: entries are next-day opens on all 11 trades and never a signal-day
# close, and average loss ($1,102) exceeds average win ($693), which is the
# shape the spec predicts for mean reversion rather than the shape a
# look-ahead bug produces.
#
# Parameters were perturbed twelve ways (entry z, RSI gate, SMA lookback, ATR
# multiple, time stop, exit RSI). Return stayed positive in every one, from
# +5.14% to +16.51%, so these sit on a plateau rather than a peak. Costs were
# swept to 10bp per side and it still returns +7.21%.
#
# allow_below_regime is FALSE. The spec permits it "only after backtesting"
# and the backtest is now done: it is what loses money in a 2022, and TLT has
# closed below its 200-day SMA for 45 straight sessions, which is that regime.
# Turning it on would be switching on the mode whose one bad year is the year
# we are currently in.
pendulum:
  symbol: TLT
  entry_z: -2.0
  entry_rsi: 10
  add_z: -2.75
  exit_rsi: 70
  time_stop_days: 10
  atr_mult: 1.5
  hard_stop_pct: 0.05
  regime_lookback: 200
  allow_below_regime: false
  risk_per_trade: 0.01
  first_tranche: 0.6
  run_after: "09:35"

vampire:
  # HALTED for the rest of 2026-09-01; resumes automatically at tomorrow's open.
  #
  # Measured at 15:30 ET on the two symbols that were left after HOOD and SPY
  # were cut, using average-cost expectancy over closed round trips:
  #
  #   TQQQ  142 closes   0% win rate   -$1.03 per trade
  #   QQQ                               -$0.13 per trade
  #
  # A 0% win rate over 142 closes is not variance. TQQQ went 69.32 to 68.41 in
  # a near-straight line and the scalper, which is built to fade oscillation,
  # bought every step down and averaged in. Doubling its sleeve at the 13:43
  # restart made expectancy three times worse (-$0.32 to -$1.03), which is the
  # signature of a strategy with negative edge being given more size.
  #
  # The date is the mechanism, not a note: the engine compares today against
  # it and lifts the halt on its own. Nothing has to be remembered, and no
  # machine outside EC2 has to be awake for the scalper to trade the open.
  paused_until: "2026-09-02"

  # Chosen by measurement on 2026-08-31, not by volatility. What a scalper needs
  # is movement LARGER than the spread it pays to capture it. Sampling 18 liquid
  # names live gave move-per-2.5s divided by spread: PLTR 1.00, SPY 0.84,
  # QQQ 0.81, and under 0.6 for everything else including AAPL at 0.19.
  #
  # Two directions were tested and both make it worse.
  #
  # Volatile names: spreads widen with volatility. TSLA quotes $0.49 and AMD
  # $4.91, giving ratios of 0.09 and 0.00.
  #
  # Cheap names, the BlackBerry thesis: worse still, because the $0.01 minimum
  # tick is a FIXED floor and therefore a larger fraction of a smaller price.
  # Measured as spread in basis points of price: SNDL at $1.35 pays 74bp, PLUG
  # at $2.15 pays 47bp, AMC at $2.62 pays 38bp, BB at $8.07 pays 12bp, against
  # SPY at 1bp. A scalper on a $2 stock pays roughly 40 times the relative
  # spread it pays on SPY. Over 40 seconds of live sampling, most of those names
  # did not move their mid at all: BB scored 0.05, and eleven of them scored
  # 0.00.
  #
  # These three are the least bad measured, and none of them clears 1.5.
  # Round two, 2026-08-31 ~13:45 ET: 26 candidates, 92s sample, then an
  # independent 48s confirmation of the shortlist. Ranked by move/spread:
  #
  #   HOOD 12.52 then 7.57  confirmed, tight 4-5bp book while genuinely moving
  #   SPY   0.77 then 0.89  stable, sub-1
  #   TQQQ  0.47 then 0.74  stable penny spread
  #   QQQ   0.49 then 0.72  stable
  #   SOXL  0.47 then 0.60  stable
  #
  # PLTR (1.50 -> 0.26) and VST (1.95 -> 0.18) were DISQUALIFIED: their IEX
  # spreads blew out 13x and 67x between samples, so their first-round ratios
  # were book instability, not capturable movement. A single-sample ratio is
  # not evidence; a threshold set from one tight quote on a name like that
  # fires on flicker all day.
  #
  # WHAT THE SESSION ACTUALLY SHOWED, 2026-08-31 close of business. The
  # move/spread ranking above did not predict realized P&L, and the gap is not
  # subtle:
  #
  #   QQQ    1,039 fills   +$187.99   ranked 0.72, made all the money
  #   SPY    1,024 fills   -$  1.49   ranked 0.89, flat
  #   HOOD      29 fills    ~flat     ranked 12.52, the top pick, produced nothing
  #   TQQQ      27 fills    ~flat     ranked 0.74
  #
  # HOOD was also where the covering deadlock surfaced. One session is not a
  # verdict on the metric, but a live P&L result on two thousand fills is
  # stronger evidence than a 92-second pre-trade sample, and it points the
  # other way. QQQ and SPY are therefore restored as the primary pair rather
  # than dropped, and HOOD and TQQQ are kept so the comparison keeps running
  # on real fills instead of on quotes.
  #
  # Read the ranking as a filter, not an ordering: it is good at rejecting
  # names that cannot work (wide books, dead mids, the sub-$2 tick floor) and
  # so far unproven at picking winners among the names that can.
  symbols:
    - QQQ
    - TQQQ
    # - HOOD  # removed 2026-09-01 13:45 ET on measured P&L, not on a metric.
    #           Realized -$567.93 across 2,740 fills, and negative in EVERY
    #           hour of the session: -103, -169, -157, -104, -35. Five
    #           consecutive losing hours is a structural bleed at these
    #           thresholds, not variance. It also lost $79 on 2026-08-31, so
    #           this is two sessions, both negative. HOOD was the top pick of
    #           the move/spread ranking (12.52, an order of magnitude above
    #           QQQ's 0.72); that ranking has now been wrong about the same
    #           name twice, in the same direction. Its spread is also
    #           unstable: sampled at 0.040, 0.060 and 0.160 within one
    #           session, so the derived threshold kept moving under it.
    # - SPY   # removed 2026-09-01 alongside HOOD. Smaller but the same shape:
    #           -$55.45 realized, negative in every hour after the first, on
    #           1,769 fills. On 2026-08-31 it was -$1.91 on 1,024 fills. Two
    #           sessions, ~2,800 fills, no profitable hour to point at.
    # - SOXL  # removed 2026-08-31: shortable=false, easy_to_borrow=false.
    #           A bi-directional scalper cannot run on a name with no borrow;
    #           every short signal is a guaranteed venue refusal.
    #
    # What survives is what has actually made money. QQQ is the only symbol
    # profitable across both sessions (+$192.82 then +$14.55). TQQQ is roughly
    # flat (-$21 today) and is kept as the second name so the sleeve is not a
    # single-symbol bet, not because it has proven an edge.
  tick_threshold: 0.02
  position_size: 10
  max_position: 100
  bleed_window_seconds: 5
  reference_type: vwap
  max_daily_loss: 50.0
  max_trades_per_min: 20

options:
  # Priced for a $20,000 sleeve. The previous list was untradeable here: at
  # today's prices one SPY put ties up $71,500, AAPL $29,700 and NVDA $20,200,
  # so a single contract met or exceeded the entire allocation and the scanner
  # would have found nothing to do all week. These names put collateral between
  # $200 and $2,400 a contract, which is what makes diversifying possible at
  # this size. Thin chains are rejected by min_open_interest rather than by
  # being left off the list.
  symbols:
    - CLF
    - NIO
    - ABAT
    - F
    - SOFI
    - MARA
    - RIVN
    - T
  # BAC (~$5,900 collateral) and INTC (~$8,300) are excluded deliberately: the
  # 5% max_single_trade_pct gate is $5,000 on a $100k account, so neither can
  # ever clear it. Leaving them in only fills the log with skips.
  csp:
    min_premium_pct: 0.005
    max_days_to_expiry: 45
    min_days_to_expiry: 7
    max_delta: -0.30
    min_open_interest: 100
  covered_call:
    min_premium_pct: 0.003
    max_days_to_expiry: 30
    min_days_to_expiry: 7
    min_delta: 0.20
    max_delta: 0.35

sixfold:
  universe:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - META
    - JPM
    - V
    - JNJ
    - UNH
    - PG
    - HD
    - COST
    - ABBV
    - LLY
    - MRK
    - PEP
    - KO
  buy_threshold: 65.0
  dispose_threshold: 40.0
  scan_interval_seconds: 3600

risk:
  max_daily_loss_pct: 0.02
  max_position_pct: 0.10
  max_single_trade_pct: 0.05
  min_cash_reserve: 5000.0
  circuit_breaker_cooldown_minutes: 30

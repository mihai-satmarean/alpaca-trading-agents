allocation:
  sixfold_pct: 0.20
  options_pct: 0.15
  vampire_pct: 0.20
  pendulum_pct: 0.15
  reserve_pct: 0.15
pendulum:
  symbol: TLT
  entry_z: -2.0
  entry_rsi: 10
  add_z: -2.75
  exit_rsi: 70
  time_stop_days: 10
  atr_mult: 1.5
  hard_stop_pct: 0.05
  regime_lookback: 200
  allow_below_regime: true
  below_regime_size_mult: 0.5
  below_regime_atr_mult: 1.0
  risk_per_trade: 0.01
  first_tranche: 0.6
  run_after: 09:35
vampire:
  paused_until: '2026-09-02'
  regime_advisor:
    enabled: true
    model: dell4-chat
    window_minutes: 15
    bars: 30
    ttl_minutes: 20
    min_confidence: 0.0
    # Which regimes may open a NEW lot. Defaults to [chop], which is correct
    # for a two-sided scalper: any trend runs over mean reversion whichever
    # way it goes. A venue where the symbol cannot be shorted overrides this
    # automatically (see regimes_for_direction) because a long-only book wants
    # trend_up, the one regime where the dip it buys gets bought back. Set it
    # here only to override that derivation deliberately.
    tradeable_regimes: [chop]

  # Chosen by measurement on 2026-08-31, not by volatility. What a scalper needs
  # is movement LARGER than the spread it pays to capture it. Sampling 18 liquid
  # names live gave move-per-2.5s divided by spread: PLTR 1.00, SPY 0.84,
  # QQQ 0.81, and under 0.6 for everything else including AAPL at 0.19.
  #
  # Two directions were tested and both make it worse.
  #
  # Volatile names: spreads widen with volatility. TSLA quotes $0.49 and AMD
  # $4.91, giving ratios of 0.09 and 0.00.
  #
  # Cheap names, the BlackBerry thesis: worse still, because the $0.01 minimum
  # tick is a FIXED floor and therefore a larger fraction of a smaller price.
  # Measured as spread in basis points of price: SNDL at $1.35 pays 74bp, PLUG
  # at $2.15 pays 47bp, AMC at $2.62 pays 38bp, BB at $8.07 pays 12bp, against
  # SPY at 1bp. A scalper on a $2 stock pays roughly 40 times the relative
  # spread it pays on SPY. Over 40 seconds of live sampling, most of those names
  # did not move their mid at all: BB scored 0.05, and eleven of them scored
  # 0.00.
  #
  # These three are the least bad measured, and none of them clears 1.5.
  # Round two, 2026-08-31 ~13:45 ET: 26 candidates, 92s sample, then an
  # independent 48s confirmation of the shortlist. Ranked by move/spread:
  #
  #   HOOD 12.52 then 7.57  confirmed, tight 4-5bp book while genuinely moving
  #   SPY   0.77 then 0.89  stable, sub-1
  #   TQQQ  0.47 then 0.74  stable penny spread
  #   QQQ   0.49 then 0.72  stable
  #   SOXL  0.47 then 0.60  stable
  #
  # PLTR (1.50 -> 0.26) and VST (1.95 -> 0.18) were DISQUALIFIED: their IEX
  # spreads blew out 13x and 67x between samples, so their first-round ratios
  # were book instability, not capturable movement. A single-sample ratio is
  # not evidence; a threshold set from one tight quote on a name like that
  # fires on flicker all day.
  #
  # WHAT THE SESSION ACTUALLY SHOWED, 2026-08-31 close of business. The
  # move/spread ranking above did not predict realized P&L, and the gap is not
  # subtle:
  #
  #   QQQ    1,039 fills   +$187.99   ranked 0.72, made all the money
  #   SPY    1,024 fills   -$  1.49   ranked 0.89, flat
  #   HOOD      29 fills    ~flat     ranked 12.52, the top pick, produced nothing
  #   TQQQ      27 fills    ~flat     ranked 0.74
  #
  # HOOD was also where the covering deadlock surfaced. One session is not a
  # verdict on the metric, but a live P&L result on two thousand fills is
  # stronger evidence than a 92-second pre-trade sample, and it points the
  # other way. QQQ and SPY are therefore restored as the primary pair rather
  # than dropped, and HOOD and TQQQ are kept so the comparison keeps running
  # on real fills instead of on quotes.
  #
  # Read the ranking as a filter, not an ordering: it is good at rejecting
  # names that cannot work (wide books, dead mids, the sub-$2 tick floor) and
  # so far unproven at picking winners among the names that can.
  symbols:
  - QQQ
  - TQQQ
  tick_threshold: 0.02
  position_size: 10
  max_position: 100
  bleed_window_seconds: 5
  reference_type: vwap
  max_daily_loss: 50.0
  max_trades_per_min: 20
options:
  symbols:
  - CLF
  - NIO
  - ABAT
  - F
  - SOFI
  - MARA
  - RIVN
  - T
  csp:
    min_premium_pct: 0.005
    max_days_to_expiry: 45
    min_days_to_expiry: 7
    max_delta: -0.3
    min_open_interest: 100
  covered_call:
    min_premium_pct: 0.003
    max_days_to_expiry: 30
    min_days_to_expiry: 7
    min_delta: 0.2
    max_delta: 0.35
sixfold:
  universe:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - JPM
  - V
  - JNJ
  - UNH
  - PG
  - HD
  - COST
  - ABBV
  - LLY
  - MRK
  - PEP
  - KO
  buy_threshold: 60.0
  hold_threshold: 50.0
  dispose_threshold: 40.0
  max_concurrent: 20
  # Ported from the live Tradier deployment of this same framework
  # (sixfold-trader Lambda, live since 2026-09-01) on 2026-09-10, matching
  # its defaults exactly (Tashi's spec: SPEC 3.8 take-profit/time-stop,
  # SPEC 3.5 re-entry lockout). Scoped to symbols this process registered
  # opening (src/core/sixfold_registry.py); the pre-existing
  # dispose_threshold rule above is unaffected and untouched.
  take_profit_pct: 35.0
  time_stop_days: 183
  reentry_lockout_days: 56
  # S&P 400 constituents (config/universe_sp400.txt, 400 tickers), appended to
  # the inline list above. A full scan is about seven minutes at ~1.1s per name
  # through the fundamentals feed, against an hourly rescan.
  universe_file: universe_sp400.txt
  scan_interval_seconds: 3600
risk:
  max_daily_loss_pct: 0.02
  max_position_pct: 0.1
  max_single_trade_pct: 0.05
  min_cash_reserve: 5000.0
  circuit_breaker_cooldown_minutes: 30
adapters:
  autobelay:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: competitors/repos/bill-mccormick-dg__alpaca-hackathon
    temperature: 0.6
  killswitch:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: competitors/repos/SamsonDoski__alpaca-trading-assistant
    temperature: 0.5
    max_daily_decay: 0.04
    max_positions: 10
    max_per_group: 6
  shouldai:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: competitors/repos/nabielnovelkhubran__Should-AI-Buy
    temperature: 0.7
    max_open_positions: 10
    min_opportunity_score: 40
  neural_trader:
    enabled: false
    capital_pct: 0.0
    dry_run: true
    config_variant: default
    source: neural-trader-ruv MCP (localhost:8100)
    mcp_url: http://localhost:8100/sse
    strategy: momentum_trading
    symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - NVDA
    min_confidence: 0.65
    max_position_pct: 0.02
    scan_interval_seconds: 300
  bull_spread:
    enabled: true
    capital_pct: 0.125
    dry_run: false
    config_variant: default
    source: built-in (VetoAlpha reference)
    symbols:
    - QBTS
    - SLV
    - SPY
    - QQQ
    - AAPL
    spread_types:
    - bull_put_credit
    - bull_call_debit
    contracts_per_spread: 1
    max_concurrent_spreads: 5
    wing_width: 5.0
    dte_min: 20
    dte_max: 45
    target_short_delta: 0.2
    min_open_interest: 50
    max_bid_ask_spread_pct: 0.2
    min_net_credit: 0.1
    min_score: 40.0
    scan_interval_seconds: 600

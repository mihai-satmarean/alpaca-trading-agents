[project]
name = "alpaca-trading-agents"
version = "0.1.0"
description = "ProductAdvisors -- Autonomous AI options trading agents for the Alpaca Hackathon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "ProductAdvisors" },
]

dependencies = [
    "alpaca-py>=0.43",
    "streamlit>=1.36",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
